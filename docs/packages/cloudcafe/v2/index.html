<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CloudCafe Remote Mini-App</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eaf4ef; color: #17392f; padding: 28px 22px 44px; }
    .brand { color: #23705a; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .hero { margin-top: 18px; padding: 28px 24px; border-radius: 28px; background: #fff; box-shadow: 0 12px 36px rgba(20,78,60,.10); }
    h1 { margin: 0; font-size: 36px; line-height: 1.05; letter-spacing: -.04em; }
    p { color: #557269; font-size: 16px; line-height: 1.55; }
    .version { display: inline-flex; margin-top: 12px; padding: 8px 12px; border-radius: 999px; background: #cce8dc; color: #16523f; font-size: 13px; font-weight: 800; }
    .card { margin-top: 18px; padding: 20px; border-radius: 22px; background: #1d7258; color: #fff; }
    .card p { color: #dcf1e9; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="brand">CloudCafe</div>
  <main class="hero">
    <h1>CloudCafe Remote Mini-App</h1>
    <p>A visibly updated merchant frontend delivered through the same governed Xync runtime.</p>
    <span class="version">Version 2</span>
  </main>
  <section class="card">
    <strong>New release, same package identity</strong>
    <p>Version and integrity metadata changed without changing the Xync mobile application.</p>
  </section>
</body>
</html>
