<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CloudCafe Remote Mini-App</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f2eb; color: #2d211b; padding: 28px 22px 44px; }
    .brand { color: #765341; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .hero { margin-top: 18px; padding: 28px 24px; border-radius: 28px; background: #fff; box-shadow: 0 12px 36px rgba(67,45,33,.09); }
    h1 { margin: 0; font-size: 36px; line-height: 1.05; letter-spacing: -.04em; }
    p { color: #75645b; font-size: 16px; line-height: 1.55; }
    .version { display: inline-flex; margin-top: 12px; padding: 8px 12px; border-radius: 999px; background: #e9ddd2; color: #644738; font-size: 13px; font-weight: 800; }
    .card { margin-top: 18px; padding: 20px; border-radius: 22px; background: #6b5b4d; color: #fff; }
    .card p { color: #f4ece5; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="brand">CloudCafe</div>
  <main class="hero">
    <h1>CloudCafe Remote Mini-App</h1>
    <p>A tiny merchant frontend delivered on demand and verified by Xync before it runs.</p>
    <span class="version">Version 1</span>
  </main>
  <section class="card">
    <strong>Freshly delivered</strong>
    <p>This interface is self-contained: no external libraries, images, fonts, or network APIs.</p>
  </section>
</body>
</html>
